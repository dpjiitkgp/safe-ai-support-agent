# Formatting and lint settings only. Running the proof of concept needs nothing but Python 3.11+;
# ruff is a development tool:  ruff format . && ruff check .

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs, and modern-syntax upgrades
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["helia_gateway", "tests"]
